<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!--ART-START-->
<title>Orbis in 18 Steps</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Orbis, the story and the game, told step by step for someone who has never heard of it.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=IBM+Plex+Mono:wght@500&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
<style>
/* Layout: a one-screen stepper. The scene stage sits left (on top on phones), the story copy right, the five acts run across the top. One dark look on purpose: the planet at night. */
:root{
  --void:#07090b; --deep:#0d1316; --rock:#141c20; --rock2:#1f2a2f; --line:#27353b;
  --bone:#ebe5d7; --text:#c6c9bf; --dust:#87938e;
  --core:#62e8d3; --rust:#d65a3c; --ochre:#d09a49; --colony:#9fd66a;
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--void);color:var(--text);font-family:var(--serif);-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
.app{height:100%;max-width:1440px;margin:0 auto;display:grid;grid-template-rows:auto minmax(0,1fr) auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top bar */
.top{display:flex;align-items:flex-end;gap:20px;padding-block:14px 12px}
.brand{font:800 26px/1 var(--display);letter-spacing:.32em;color:var(--bone);padding-bottom:1px}
.progress{flex:1;display:flex;gap:12px;min-width:0}
.act{display:flex;flex-direction:column;gap:6px;min-width:0}
.act-name{font:500 10.5px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--dust);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.act.on .act-name{color:var(--core)}
.segs{display:flex;gap:3px}
.seg{flex:1;height:16px;padding:6px 0;border:0;background:none;cursor:pointer}
.seg::before{content:"";display:block;height:4px;border-radius:2px;background:var(--line);transition:background .3s}
.seg.done::before{background:var(--dust)}
.seg.cur::before{background:var(--core);box-shadow:0 0 10px var(--core)}
.seg:focus-visible{outline:2px solid var(--core);outline-offset:2px}
.count{font:500 13px/1 var(--mono);color:var(--dust);font-variant-numeric:tabular-nums;white-space:nowrap;padding-bottom:3px}
.count b{color:var(--bone);font-weight:500}

/* main */
.main{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:clamp(20px,3vw,44px);align-items:center;min-height:0}
.stage{margin:0;position:relative;width:100%;aspect-ratio:8/5;max-height:100%;max-width:100%;background:var(--deep);
  border:1px solid var(--line);border-radius:4px;overflow:hidden}
.stage>svg,.stage>video,.stage>img{position:absolute;inset:0;width:100%;height:100%;display:block}
.stage>video,.stage>img{object-fit:cover;animation:fadeIn 1s both}
.media-toggle{position:absolute;right:10px;bottom:10px;z-index:2;font:500 11px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;
  color:var(--bone);background:color-mix(in srgb,var(--void) 70%,transparent);border:1px solid var(--line);border-radius:3px;padding:7px 9px;cursor:pointer}
.copy{max-height:100%;overflow-y:auto;padding-block:6px 10px;min-width:0;scrollbar-width:thin}
.copy>*{animation:rise .7s cubic-bezier(.2,.7,.2,1) calc(var(--i,0)*85ms + 120ms) both}
.kicker{font:500 12px/1.4 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--core);margin:0 0 10px}
.copy h2{font:800 clamp(38px,4.6vw,68px)/.92 var(--display);text-transform:uppercase;letter-spacing:.01em;color:var(--bone);margin:0 0 18px;text-wrap:balance}
.copy p{font-size:18px;line-height:1.55;margin:0 0 12px;max-width:34em}
.copy .hit{font-style:italic;font-size:20px;line-height:1.45;color:var(--bone);margin-top:16px}
.copy .dark{color:var(--rust)}
.copy .hint{font:500 12px/1.5 var(--mono);color:var(--dust);letter-spacing:.04em;margin-top:20px}
.copy ul{list-style:none;padding:0;margin:4px 0 12px;display:grid;gap:8px;max-width:34em}
.copy li{font-size:17px;line-height:1.45;padding-left:16px;position:relative}
.copy li::before{content:"";position:absolute;left:0;top:.62em;width:6px;height:6px;background:var(--rust);transform:rotate(45deg)}
.copy li b{color:var(--bone);font-weight:600}
.copy a{color:var(--bone);text-decoration-color:var(--core);text-underline-offset:3px}
.copy a:hover{color:var(--core)}
.tx{border:1px solid var(--line);background:var(--deep);padding:14px 16px;margin:6px 0 14px;max-width:34em;border-radius:3px}
.tx-head{font:500 11px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--core);margin-bottom:10px}
.tx p{font-size:17px;margin:0;color:var(--bone)}
.choices{display:flex;flex-wrap:wrap;gap:10px;margin:4px 0 12px}
.choice{font:800 17px/1 var(--display);letter-spacing:.12em;text-transform:uppercase;padding:12px 18px;border-radius:3px;cursor:pointer;
  background:transparent;color:var(--bone);border:1px solid var(--rust)}
.choice:hover,.choice[aria-pressed="true"]{background:var(--rust);color:var(--void)}
.choice.alt{border-color:var(--line)}
.choice.alt:hover,.choice.alt[aria-pressed="true"]{background:var(--bone);color:var(--void)}
.choice:focus-visible,.btn:focus-visible,.media-toggle:focus-visible{outline:2px solid var(--core);outline-offset:3px}
.reads{display:grid;gap:10px;margin:6px 0 16px;max-width:34em}
.reads a,.reads div{display:block;border:1px solid var(--line);border-radius:3px;padding:11px 14px;text-decoration:none;background:var(--deep)}
.reads a:hover{border-color:var(--core)}
.reads b{display:block;font:800 19px/1.1 var(--display);letter-spacing:.06em;text-transform:uppercase;color:var(--bone);margin-bottom:3px}
.reads span{font-size:15px;color:var(--text)}

/* bottom nav */
.nav{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px 16px}
.btn{font:800 18px/1 var(--display);letter-spacing:.16em;text-transform:uppercase;padding:13px 26px;border-radius:3px;cursor:pointer;
  background:var(--deep);color:var(--bone);border:1px solid var(--line)}
.btn:hover{border-color:var(--dust)}
.btn:disabled{opacity:.35;cursor:default}
.btn.next{background:var(--core);color:var(--void);border-color:var(--core)}
.btn.next:hover{filter:brightness(1.1)}
.keys{font:500 12px/1 var(--mono);color:var(--dust);letter-spacing:.06em}
.mid{display:flex;align-items:center;gap:16px}

@media (max-width:860px){
  .main{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr);align-items:start;gap:16px}
  .stage{max-height:none}
  .top{flex-wrap:wrap;gap:10px 16px;align-items:center}
  .progress{order:3;flex-basis:100%;gap:6px}
  .act-name{display:none}
  .brand{font-size:22px}
  .copy h2{font-size:clamp(34px,9vw,52px);margin-bottom:12px}
  .copy p{font-size:16.5px}
  .copy .hit{font-size:18px}
  .keys{display:none}
  .btn{padding:12px 20px;flex:1}
}

/* scene palette */
.f-void{fill:var(--void)} .f-deep{fill:var(--deep)} .f-rock{fill:var(--rock)} .f-rock2{fill:var(--rock2)} .f-line{fill:var(--line)}
.f-bone{fill:var(--bone)} .f-dust{fill:var(--dust)} .f-core{fill:var(--core)} .f-rust{fill:var(--rust)} .f-ochre{fill:var(--ochre)} .f-colony{fill:var(--colony)}
.s-bone{stroke:var(--bone)} .s-dust{stroke:var(--dust)} .s-core{stroke:var(--core)} .s-rust{stroke:var(--rust)} .s-ochre{stroke:var(--ochre)} .s-line{stroke:var(--line)} .s-colony{stroke:var(--colony)}
.k-bone{color:var(--bone)} .k-dust{color:var(--dust)} .k-core{color:var(--core)} .k-rust{color:var(--rust)} .k-ochre{color:var(--ochre)} .k-colony{color:var(--colony)} .k-rock2{color:var(--rock2)} .k-void{color:var(--void)}
.lbl{font:500 22px var(--mono);letter-spacing:.08em;fill:var(--dust)}
.lbl-d{font:800 34px var(--display);letter-spacing:.08em;fill:var(--bone)}
.call{font:italic 400 30px var(--serif);fill:var(--core)}
.nofill{fill:none}

/* scene motion: every element rests in its final state, the animation only brings it there */
.scene{animation:fadeIn .6s both}
.fade{animation:fadeIn var(--du,.9s) ease var(--t,0s) both}
.rise{animation:rise var(--du,.9s) cubic-bezier(.2,.7,.2,1) var(--t,0s) both}
.drop{animation:drop var(--du,2.2s) cubic-bezier(.15,.6,.25,1) var(--t,0s) both}
.grow{transform-box:fill-box;transform-origin:center;animation:grow var(--du,.6s) cubic-bezier(.2,.8,.3,1.25) var(--t,0s) both}
.growy{transform-box:fill-box;transform-origin:50% 100%;animation:growY var(--du,.7s) ease-out var(--t,0s) both}
.draw{stroke-dasharray:1;animation:draw var(--du,1.4s) ease-in-out var(--t,0s) both}
.flow{stroke-dasharray:6 10;animation:flow var(--du,1.1s) linear infinite}
.pulse{animation:pulse var(--du,2.6s) ease-in-out var(--t,0s) infinite}
.twinkle{animation:twinkle 3.4s ease-in-out var(--t,0s) infinite}
.flicker{animation:flicker var(--du,.6s) steps(1) var(--t,0s) infinite}
.march{animation:march var(--du,4s) linear var(--t,0s) infinite both}
.march1{animation:march var(--du,4s) ease-out var(--t,0s) 1 both}
.spin{animation:spin 70s linear infinite}
.close{transform-box:fill-box;transform-origin:center;opacity:0;animation:close 3s ease-in var(--t,0s) infinite both}
.ring{transform-box:fill-box;transform-origin:center;opacity:0;animation:ring var(--du,2.4s) ease-out var(--t,0s) infinite both}
.flameoff{opacity:0;animation:flameOff .7s ease var(--t,0s) both}
.dust{transform-box:fill-box;transform-origin:center;opacity:0;animation:dust 1.8s ease-out var(--t,0s) both}
.glimpse{opacity:0;animation:glimpse var(--du,3.2s) ease var(--t,0s) both}
.drift{opacity:0;animation:drift 4.2s ease-out var(--t,0s) infinite both}
.sweep{animation:sweep 3.6s ease-in-out infinite alternate}
.darken{opacity:.15;animation:darken .5s steps(2) var(--t,0s) both}
.shell{stroke-dasharray:.05 1.2;animation:shell var(--du,1.6s) linear var(--t,0s) infinite both}
.flash{transform-box:fill-box;transform-origin:center;opacity:0;animation:flash var(--du,1.6s) ease-out var(--t,0s) both}
.cap{transform-box:fill-box;transform-origin:50% 100%;animation:cap 2.4s cubic-bezier(.2,.7,.2,1) var(--t,0s) both}
.descend{transform:translateY(-600px);animation:descend 7s cubic-bezier(.55,.05,.35,1) .4s both}
.depth{transform:translateY(380px);animation:descend 7s cubic-bezier(.55,.05,.35,1) .4s both}
.dome{animation:domeOpen 1.8s cubic-bezier(.4,0,.2,1) var(--t,0s) both}
.blink{animation:blink 1.2s steps(2) var(--t,0s) infinite}
.inout{opacity:0;animation:inout var(--du,4s) ease var(--t,0s) both}
.lift{animation:lift var(--du,2.6s) cubic-bezier(.2,.7,.2,1) var(--t,0s) both}
.bob{animation:bob var(--du,5s) ease-in-out var(--t,0s) infinite alternate}
.g-proc,.g-return,.g-held{display:none}
.accepted .g-proc,.accepted .g-return{display:inline}
.refused .g-held{display:inline}
.accepted .g-waves{animation:fadeOut 1.2s ease .3s both}

@keyframes fadeIn{from{opacity:0}}
@keyframes fadeOut{to{opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
@keyframes drop{from{transform:translateY(var(--dy,-330px))}}
@keyframes grow{from{transform:scale(0);opacity:0}}
@keyframes growY{from{transform:scaleY(0)}}
@keyframes draw{from{stroke-dashoffset:1}}
@keyframes flow{to{stroke-dashoffset:-32}}
@keyframes pulse{50%{opacity:.35}}
@keyframes twinkle{50%{opacity:.08}}
@keyframes flicker{0%{opacity:1}20%{opacity:.15}40%{opacity:.9}55%{opacity:0}70%{opacity:.8}}
@keyframes march{from{transform:translate(var(--dx,0),var(--dy,0));opacity:0}10%{opacity:1}86%{opacity:1}to{transform:translate(0,0);opacity:var(--end,0)}}
@keyframes spin{to{transform:translateX(var(--w))}}
@keyframes close{from{transform:scale(1);opacity:0}25%{opacity:.85}to{transform:scale(.04);opacity:0}}
@keyframes ring{from{transform:scale(.2);opacity:.9}to{transform:scale(1.7);opacity:0}}
@keyframes flameOff{from{opacity:1}to{opacity:0}}
@keyframes dust{from{transform:scale(.2);opacity:0}35%{opacity:.5}to{transform:scale(1.5);opacity:0}}
@keyframes glimpse{0%{opacity:0}18%{opacity:1}70%{opacity:1}74%{opacity:0}100%{opacity:0}}
@keyframes drift{from{transform:translateY(24px);opacity:0}30%{opacity:.95}to{transform:translateY(-44px);opacity:0}}
@keyframes sweep{from{transform:rotate(-8deg)}to{transform:rotate(6deg)}}
@keyframes darken{from{opacity:1}to{opacity:.15}}
@keyframes shell{from{stroke-dashoffset:1.1}to{stroke-dashoffset:-.05}}
@keyframes flash{from{transform:scale(.05);opacity:1}30%{opacity:.9}to{transform:scale(1.6);opacity:0}}
@keyframes cap{from{transform:translateY(110px) scale(.2);opacity:0}}
@keyframes descend{from{transform:translateY(0)}}
@keyframes domeOpen{from{transform:rotate(0)}}
@keyframes blink{50%{opacity:.15}}
@keyframes inout{0%{opacity:0}18%{opacity:1}80%{opacity:1}100%{opacity:0}}
@keyframes lift{from{transform:translateY(var(--dy,140px))}}
@keyframes bob{from{transform:translateY(300px)}}

/* motion follows the system's reduce-motion setting until the viewer flips the switch */
.still .stage *,.still .stage,.still .copy>*{animation:none!important}
.motion{font:500 11px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--dust);background:none;border:1px solid var(--line);
  border-radius:3px;padding:7px 9px;cursor:pointer}
.motion:hover{color:var(--bone)}
.motion:focus-visible{outline:2px solid var(--core);outline-offset:3px}
</style>
</head>
<body>

<!-- shared drawings: figures are drawn with feet at 0,0 in currentColor -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="2.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="glow-big" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="7"/></filter>
    <radialGradient id="g-core"><stop offset="0" style="stop-color:var(--core);stop-opacity:1"/><stop offset=".4" style="stop-color:var(--core);stop-opacity:.42"/><stop offset="1" style="stop-color:var(--core);stop-opacity:0"/></radialGradient>
    <radialGradient id="g-ochre"><stop offset="0" style="stop-color:var(--ochre);stop-opacity:.9"/><stop offset="1" style="stop-color:var(--ochre);stop-opacity:0"/></radialGradient>
    <radialGradient id="g-atmo"><stop offset=".8" style="stop-color:var(--core);stop-opacity:0"/><stop offset=".865" style="stop-color:var(--core);stop-opacity:.38"/><stop offset="1" style="stop-color:var(--core);stop-opacity:0"/></radialGradient>
    <radialGradient id="g-planet" cx=".36" cy=".34" r=".8"><stop offset="0" style="stop-color:var(--rock2)"/><stop offset=".6" style="stop-color:var(--rock)"/><stop offset="1" style="stop-color:var(--void)"/></radialGradient>
    <linearGradient id="g-term" x1="0" x2="1"><stop offset=".42" style="stop-color:var(--void);stop-opacity:0"/><stop offset="1" style="stop-color:var(--void);stop-opacity:.93"/></linearGradient>
    <linearGradient id="g-night" x1="0" x2="0" y1="0" y2="1"><stop offset="0" style="stop-color:var(--void)"/><stop offset="1" style="stop-color:var(--deep)"/></linearGradient>
    <linearGradient id="g-dusk" x1="0" x2="0" y1="0" y2="1"><stop offset="0" style="stop-color:var(--void)"/><stop offset=".62" style="stop-color:var(--rock)"/><stop offset="1" style="stop-color:var(--ochre);stop-opacity:.55"/></linearGradient>
    <linearGradient id="g-red" x1="0" x2="0" y1="0" y2="1"><stop offset="0" style="stop-color:var(--void)"/><stop offset=".55" style="stop-color:var(--rock)"/><stop offset="1" style="stop-color:var(--rust);stop-opacity:.75"/></linearGradient>
    <linearGradient id="g-dawn" x1="0" x2="0" y1="0" y2="1"><stop offset="0" style="stop-color:var(--deep)"/><stop offset=".7" style="stop-color:var(--rock2)"/><stop offset="1" style="stop-color:var(--ochre);stop-opacity:.6"/></linearGradient>
    <linearGradient id="g-light" x1="0" y1="0" x2="1" y2=".4"><stop offset="0" style="stop-color:var(--bone);stop-opacity:.34"/><stop offset="1" style="stop-color:var(--bone);stop-opacity:0"/></linearGradient>
    <linearGradient id="g-flame" x1="0" x2="1"><stop offset="0" style="stop-color:var(--bone);stop-opacity:.95"/><stop offset=".3" style="stop-color:var(--ochre)"/><stop offset="1" style="stop-color:var(--rust);stop-opacity:0"/></linearGradient>
    <linearGradient id="g-stem" x1="0" x2="0" y1="0" y2="1"><stop offset="0" style="stop-color:var(--ochre)"/><stop offset="1" style="stop-color:var(--rust);stop-opacity:.4"/></linearGradient>
    <linearGradient id="g-glowup" x1="0" x2="0" y1="1" y2="0"><stop offset="0" style="stop-color:var(--core);stop-opacity:.55"/><stop offset="1" style="stop-color:var(--core);stop-opacity:0"/></linearGradient>

    <!-- a colonist soldier, 1.8 m = 36 units -->
    <g id="p-human" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
      <path d="M0 -27 V-14" stroke-width="5.4"/>
      <path d="M0 -14 L-3 0 M0 -14 L3 0" stroke-width="3.2"/>
      <path d="M0 -25 L-4 -15 M0 -25 L4 -17 L9 -20" stroke-width="2.4"/>
      <circle cx="0" cy="-31.5" r="3.8" fill="currentColor" stroke="none"/>
    </g>
    <!-- an ancient: 2.5 m = 50 units, slender, long hands -->
    <g id="p-ancient" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
      <path d="M0 -41 V-23" stroke-width="3.2"/>
      <path d="M0 -23 L-2.6 -11 L-3 0 M0 -23 L2.2 -11 L3 0" stroke-width="2"/>
      <path d="M-1 -39 L-4.5 -27 L-5.5 -15 M1 -39 L4.5 -27 L5.5 -15" stroke-width="1.6"/>
      <path d="M-5.5 -15 l-1 4.6 M-5.5 -15 l.4 4.9 M5.5 -15 l1 4.6 M5.5 -15 l-.4 4.9" stroke-width="1"/>
      <ellipse cx="0" cy="-45.5" rx="2.4" ry="4" fill="currentColor" stroke="none"/>
    </g>
    <!-- a Given, standing: hunched, head forward, arms to the knees, crystal along the spine -->
    <g id="p-given-stand" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-3 -18 Q-3 -33 6 -36" stroke-width="3.4"/>
      <path d="M-3 -18 L1 -9 L-2 0 M-3 -18 L-6 -9 L-4 0" stroke-width="2"/>
      <path d="M4 -34 L7 -22 L9 -9 M3 -34 L3 -22 L5 -10" stroke-width="1.5"/>
      <path d="M9 -9 l0 6 M9 -9 l2 5.5 M5 -10 l-.5 6 M5 -10 l1.8 5.5" stroke-width=".9"/>
      <ellipse cx="10" cy="-37" rx="3.4" ry="2.6" fill="currentColor" stroke="none" transform="rotate(25 10 -37)"/>
      <path d="M-2.4 -21 Q-2.6 -30 3 -34" stroke-width="1.1" style="stroke:var(--core)" stroke-dasharray="1.6 2.4" filter="url(#glow)"/>
    </g>
    <!-- a Given, running on all fours, facing right -->
    <g id="p-given-run" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-15 -13 Q-2 -19 12 -14" stroke-width="3.4"/>
      <path d="M-14 -13 L-20 -6 L-19 0 M-13 -13 L-11 -6 L-14 0" stroke-width="2"/>
      <path d="M10 -15 L18 -8 L24 0 M8 -15 L12 -7 L15 0" stroke-width="1.6"/>
      <path d="M24 0 l3 -.5 M24 0 l2.4 1.2 M15 0 l3 -.3" stroke-width=".9"/>
      <ellipse cx="17" cy="-13" rx="3.6" ry="2.5" fill="currentColor" stroke="none"/>
      <path d="M-12 -14.6 Q-2 -19 9 -15.6" stroke-width="1.1" style="stroke:var(--core)" stroke-dasharray="1.6 2.4" filter="url(#glow)"/>
    </g>
    <!-- the planet's own beast: six legs, carapace, eyes that see -->
    <g id="p-beast">
      <path d="M-15 -9 Q-14 -19 0 -19 Q12 -19 15 -10 Q8 -6 -15 -9Z" fill="currentColor"/>
      <path d="M14 -13 q6 -1 8 3 q-3 3 -8 1z" fill="currentColor"/>
      <path d="M-11 -9 l-5 9 M-8 -9 l-1 9 M-2 -8 l-3 8 M1 -8 l2 8 M8 -9 l2 9 M10 -9 l6 9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>

<script>
(() => {
"use strict";

// ---------- small helpers for drawing ----------
const rng = seed => { let a = seed >>> 0; return () => { a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; };
const n1 = v => Math.round(v * 10) / 10;
const st = o => Object.entries(o).map(([k, v]) => `--${k}:${v}`).join(";");

function stars(count, seed, h = 500) {
  const r = rng(seed); let s = "";
  for (let i = 0; i < count; i++) {
    const tw = r() < .3;
    s += `<circle cx="${n1(r() * 800)}" cy="${n1(r() * h)}" r="${n1(.5 + r() * 1.1)}" class="f-bone${tw ? " twinkle" : ""}" opacity="${n1(.2 + r() * .6)}" style="--t:${n1(r() * 3)}s"/>`;
  }
  return s;
}
// a figure from the shared drawings; flip mirrors it to face left
const fig = (id, x, y, s = 1, cls = "k-bone", flip = false) =>
  `<use href="#${id}" class="${cls}" transform="translate(${x} ${y}) scale(${flip ? -s : s} ${s})"/>`;
const lbl = (x, y, t, cls = "", anchor = "middle", style = "") =>
  `<text x="${x}" y="${y}" class="lbl ${cls}" text-anchor="${anchor}" style="${style}">${t}</text>`;
const bg = cls => `<rect width="800" height="500" class="${cls}"/>`;
const bgg = id => `<rect width="800" height="500" fill="url(#${id})"/>`;

// a turning planet: the surface is a strip of land that scrolls under a fixed circle
function planet(cx, cy, R, key, seed = 7) {
  const r = rng(seed), W = 2 * R; let tile = "";
  for (let k = 0; k < 16; k++) {
    tile += `<ellipse cx="${n1(cx - R + r() * W)}" cy="${n1(cy - R * .85 + r() * R * 1.7)}" rx="${n1(R * (.08 + r() * .22))}" ry="${n1(R * (.04 + r() * .09))}" class="f-rock2" opacity="${n1(.5 + r() * .5)}"/>`;
  }
  for (let k = 0; k < 14; k++) {
    const y = cy - R * .92 + r() * R * 1.84, pol = Math.abs(y - cy) / R;
    tile += `<path d="M${n1(cx - R + r() * W)} ${n1(y)} l${n1(6 + r() * 14)} ${n1(-4 + r() * 8)} l${n1(5 + r() * 10)} ${n1(-6 + r() * 12)}" class="s-core nofill" stroke-width="1.3" opacity="${n1(.2 + pol * .7)}"/>`;
  }
  const id = `tile-${key}`;
  return `<defs><clipPath id="cp-${key}"><circle cx="${cx}" cy="${cy}" r="${R}"/></clipPath></defs>
    <circle cx="${cx}" cy="${cy}" r="${n1(R * 1.16)}" fill="url(#g-atmo)"/>
    <g clip-path="url(#cp-${key})">
      <circle cx="${cx}" cy="${cy}" r="${R}" fill="url(#g-planet)"/>
      <g class="spin" style="--w:${-W}px"><g id="${id}">${tile}</g><use href="#${id}" x="${W}"/><use href="#${id}" x="${-W}"/><use href="#${id}" x="${2 * W}"/></g>
      <ellipse cx="${cx}" cy="${n1(cy - R * .95)}" rx="${n1(R * .55)}" ry="${n1(R * .13)}" fill="url(#g-core)" opacity=".55"/>
      <ellipse cx="${cx}" cy="${n1(cy + R * .95)}" rx="${n1(R * .55)}" ry="${n1(R * .13)}" fill="url(#g-core)" opacity=".55"/>
      <circle cx="${cx}" cy="${cy}" r="${R}" fill="url(#g-term)"/>
    </g>
    <circle cx="${cx}" cy="${cy}" r="${R}" class="s-core nofill" stroke-width="1" opacity=".3"/>`;
}

// ---------- the scenes, one per step ----------
const SCENES = {
  hook() {
    const sx = 345, sy = 232;
    let rings = "";
    for (let i = 0; i < 4; i++) rings += `<circle cx="${sx}" cy="${sy}" r="150" class="s-rust nofill close" stroke-width="2.2" style="--t:${i * .75}s"/>`;
    return bg("f-void") + stars(90, 3) + planet(400, 250, 168, "hook") + rings +
      `<circle cx="${sx}" cy="${sy}" r="16" class="s-colony nofill ring" stroke-width="1.5" style="--du:2s"/>
       <circle cx="${sx}" cy="${sy}" r="4" class="f-colony" filter="url(#glow)"/>
       ${lbl(sx - 26, sy - 22, "YOU", "", "end", "fill:var(--colony)")}`;
  },
  substance() {
    const cx = 400, cy = 250, r = rng(11); let lines = "", crys = "";
    for (let i = 0; i < 18; i++) {
      const a = i / 18 * Math.PI * 2 + .1, c = Math.cos(a), s = Math.sin(a);
      lines += `<path d="M${n1(cx + c * 58)} ${n1(cy + s * 58)} L${n1(cx + c * 176)} ${n1(cy + s * 176)}" class="s-core flow nofill" stroke-width="2" opacity=".55" style="--du:${n1(1 + r() * .6)}s"/>`;
    }
    let k = 0;
    for (let i = 0; i < 240 && k < 64; i++) {
      const a = r() * Math.PI * 2, w = Math.abs(Math.sin(a));
      if (r() > .12 + .88 * w * w) continue;
      const rad = 166 + r() * 34, x = cx + Math.cos(a) * rad, y = cy + Math.sin(a) * rad, sc = n1(.7 + r() * .8);
      crys += `<g transform="translate(${n1(x)} ${n1(y)}) rotate(${n1(a * 57.3 + 90)}) scale(${sc})"><polygon points="0,-8 3.2,0 0,5 -3.2,0" class="f-core grow" filter="url(#glow)" style="--t:${n1(.6 + k * .04)}s"/></g>`;
      k++;
    }
    return bg("f-void") + stars(50, 5) +
      `<circle cx="${cx}" cy="${cy}" r="206" class="f-rock2"/>
       <circle cx="${cx}" cy="${cy}" r="186" class="f-rock"/>
       <circle cx="${cx}" cy="${cy}" r="120" fill="url(#g-core)" class="pulse" opacity=".6"/>
       <circle cx="${cx}" cy="${cy}" r="40" class="f-core" filter="url(#glow-big)"/>
       ${lines}${crys}
       ${lbl(400, 30, "RICHEST AT THE POLES", "", "middle", "fill:var(--core)")}
       ${lbl(400, 488, "RICHEST AT THE POLES", "", "middle", "fill:var(--core)")}
       ${lbl(30, 240, "ENERGY RISES", "", "start")}${lbl(30, 268, "FROM THE CORE", "", "start")}
       ${lbl(770, 240, "HARDENS INTO", "", "end")}${lbl(770, 268, "CRYSTAL", "", "end", "fill:var(--core)")}`;
  },
  reasons() {
    const shipPath = "M190 236 C 320 110, 520 120, 640 196", colPath = "M190 268 C 320 390, 520 384, 640 304";
    return bg("f-void") + stars(70, 9) +
      `<circle cx="880" cy="250" r="240" class="f-rock"/>
       <circle cx="880" cy="250" r="240" class="s-core nofill" stroke-width="1.5" opacity=".45" filter="url(#glow)"/>
       <circle cx="120" cy="252" r="64" class="f-rust" opacity=".32"/>
       <circle cx="120" cy="252" r="64" class="s-rust nofill pulse" stroke-width="1.4" opacity=".7"/>
       <path d="M80 220 l18 14 l-6 18 l22 10 M140 206 l-8 26 l18 18 M100 290 l26 -12 l16 12" class="s-dust nofill" stroke-width="1.4" opacity=".6"/>
       ${lbl(120, 350, "HOME, FAILING")}
       <path d="${shipPath}" class="s-dust nofill" stroke-width="1.2" stroke-dasharray="3 7" opacity=".6"/>
       <path d="${colPath}" class="s-dust nofill" stroke-width="1.2" stroke-dasharray="3 7" opacity=".6"/>
       <g opacity="0"><set attributeName="opacity" to="1" begin=".3s" fill="freeze"/>
         <g><g transform="scale(.6)"><use href="#p-ship" class="k-dust"/><rect x="-30" y="-8" width="56" height="4" style="fill:var(--rust)"/></g>
         <animateMotion dur="4.6s" begin=".3s" fill="freeze" path="${shipPath}" rotate="auto" calcMode="spline" keyTimes="0;1" keySplines=".3 0 .3 1"/></g></g>
       <g opacity="0"><set attributeName="opacity" to="1" begin=".8s" fill="freeze"/>
         <g><g transform="scale(.75)"><path d="M-50 -8 L-38 -16 L40 -16 L52 -6 L40 4 L-38 4Z" class="f-dust"/>${[-28, -18, -8, 2, 12, 22, 32].map(x => `<rect x="${x}" y="-9" width="5" height="4" class="f-colony"/>`).join("")}</g>
         <animateMotion dur="5.4s" begin=".8s" fill="freeze" path="${colPath}" rotate="auto" calcMode="spline" keyTimes="0;1" keySplines=".3 0 .3 1"/></g></g>
       ${lbl(400, 110, "THE COMPANY: THE PRIZE", "", "middle", "fill:var(--rust)")}
       ${lbl(400, 432, "THE COLONISTS: A WAY OUT", "", "middle", "fill:var(--colony)")}
       <g class="grow" style="--t:5.6s;--du:.5s"><g transform="rotate(-7 690 74)">
         <rect x="570" y="46" width="214" height="58" class="nofill s-bone" stroke-width="2.4"/>
         <text x="677" y="70" class="lbl" text-anchor="middle" style="fill:var(--bone);font-size:17px">SURVEY</text>
         <text x="677" y="95" class="lbl-d" text-anchor="middle" style="font-size:27px">QUIET. SAFE.</text></g></g>`;
  },
  landing() {
    const r = rng(21); let beasts = "";
    for (let i = 0; i < 6; i++) {
      const y = 386 + n1(r() * 10), x = 210 + n1(r() * 40);
      beasts += `<g class="march" style="${st({ dx: `-${x - 90}px`, t: `${n1(4.8 + i * .7)}s`, du: "5s" })}">${fig("p-beast", x, y, .9 + r() * .3, "k-ochre")}</g>`;
    }
    for (let i = 0; i < 6; i++) {
      const y = 386 + n1(r() * 10), x = 560 + n1(r() * 40);
      beasts += `<g class="march" style="${st({ dx: `${720 - x}px`, t: `${n1(5.1 + i * .7)}s`, du: "5s" })}">${fig("p-beast", x, y, .9 + r() * .3, "k-ochre", true)}</g>`;
    }
    beasts += `<g class="march" style="${st({ dx: "150px", t: "6.4s", du: "8s" })}">${fig("p-brute", 590, 392, 1.3, "k-ochre", true)}</g>`;
    const tower = x => `<path d="M${x} 362 L${x - 3} 232 Q${x} 214 ${x + 3} 232 L${x + 4} 362Z" class="f-rock2"/><ellipse cx="${x}" cy="226" rx="9" ry="6" class="f-rock2"/>
      <ellipse cx="${x + 10}" cy="214" rx="34" ry="12" class="f-dust drift" filter="url(#blur)" opacity=".3" style="--t:${n1(x / 300)}s"/>`;
    return bgg("g-dusk") + stars(40, 13, 220) +
      `<path d="M0 352 Q120 318 240 344 T480 336 T800 340 V500 H0Z" class="f-rock2" opacity=".8"/>
       ${tower(80)}${tower(160)}${tower(660)}${tower(732)}
       <rect y="380" width="800" height="120" class="f-rock"/>
       <path d="M18 382 Q70 334 132 382Z" class="f-rock2"/><ellipse cx="76" cy="378" rx="20" ry="7" class="f-void"/>
       <path d="M668 382 Q722 330 788 382Z" class="f-rock2"/><ellipse cx="728" cy="378" rx="22" ry="7" class="f-void"/>
       ${lbl(76, 430, "DENS")}${lbl(728, 430, "HIVES")}
       <rect width="800" height="500" class="f-void fade" opacity=".5" style="--t:3.6s;--du:1.6s"/>
       <ellipse cx="400" cy="384" rx="130" ry="13" class="f-dust dust" style="--t:1.8s"/>
       <g class="growy" style="--t:2.7s"><rect x="300" y="348" width="46" height="32" class="f-dust" opacity=".8"/><rect x="306" y="356" width="8" height="5" class="f-colony"/><rect x="322" y="356" width="8" height="5" class="f-colony"/></g>
       <g class="growy" style="--t:3s"><rect x="456" y="336" width="34" height="44" class="f-dust" opacity=".8"/><rect x="463" y="344" width="7" height="5" class="f-colony"/><rect x="476" y="356" width="7" height="5" class="f-colony"/></g>
       <g class="growy" style="--t:3.3s"><path d="M352 380 V350 M352 350 l10 -4" class="s-dust" stroke-width="3"/><rect x="498" y="360" width="30" height="20" class="f-dust" opacity=".7"/></g>
       <polygon points="362,347 250,382 150,382" fill="url(#g-light)" class="fade" style="--t:4.2s" opacity=".7"/>
       <g class="drop" style="--t:.2s;--du:2.4s">
         <g class="flameoff" style="--t:2.5s"><ellipse cx="372" cy="388" rx="6" ry="16" class="f-ochre flicker" filter="url(#glow)"/><ellipse cx="428" cy="388" rx="6" ry="16" class="f-ochre flicker" filter="url(#glow)" style="--t:.2s"/></g>
         ${fig("p-ship", 400, 368, 1, "k-dust")}
       </g>
       ${beasts}`;
  },
  build() {
    const cx = 380, cy = 250, R = 150, V = [];
    for (let k = 0; k < 8; k++) { const a = (22.5 + k * 45) * Math.PI / 180; V.push([n1(cx + R * Math.cos(a)), n1(cy + R * Math.sin(a))]); }
    // wall: every edge except the east one, which holds the gate
    let wall = `M${V[0][0]} ${V[0][1]}`; for (let k = 1; k < 8; k++) wall += ` L${V[k][0]} ${V[k][1]}`;
    const gx = V[0][0];
    const G = [300, 250], N1 = [380, 172], N2 = [380, 328];
    const line = (a, b, cls = "") => `<path d="M${a[0]} ${a[1]} L${b[0]} ${b[1]}" class="s-core flow nofill ${cls}" stroke-width="2.2" opacity=".75"/>`;
    const turret = (p, out = true) => { const ang = Math.atan2(p[1] - cy, p[0] - cx); return `<circle cx="${p[0]}" cy="${p[1]}" r="9" class="f-dust"/><path d="M${p[0]} ${p[1]} l${n1(Math.cos(ang) * 17)} ${n1(Math.sin(ang) * 17)}" class="s-dust" stroke-width="3.4" stroke-linecap="round"/><circle cx="${p[0]}" cy="${p[1]}" r="3" class="f-core"/>`; };
    const up = [V[5], V[6], V[7], V[4], V[3]], down = [V[0], V[1], V[2]];
    const gateT = [[gx + 10, 214], [gx + 10, 286]];
    const r = rng(31); let swarm = "", tr = "";
    for (let i = 0; i < 26; i++) swarm += `<g class="march" style="${st({ dx: `${n1(250 + r() * 60)}px`, t: `${n1(r() * 4)}s`, du: `${n1(3 + r())}s` })}"><circle cx="${n1(gx + 26 + r() * 20)}" cy="${n1(232 + r() * 36)}" r="3.4" class="f-ochre"/></g>`;
    for (let i = 0; i < 16; i++) swarm += `<g class="march" style="${st({ dx: `${n1(230 + r() * 50)}px`, dy: "70px", t: `${n1(6.8 + r() * 4)}s`, du: `${n1(3 + r())}s`, end: 1 })}"><circle cx="${n1(V[0][0] + 6 + r() * 26)}" cy="${n1(V[0][1] + 14 + r() * 26)}" r="3.4" class="f-ochre"/></g>`;
    for (const [i, t] of gateT.entries()) tr += `<path d="M${t[0] + 8} ${t[1]} L${gx + 60} ${250 + (i ? 10 : -10)}" class="s-bone flicker" stroke-width="1.4" style="--t:${i * .2}s;--du:.35s"/>`;
    let homes = "";
    for (const [x, y] of [[332, 196], [432, 196], [440, 300], [326, 300], [380, 312], [380, 180]]) homes += `<rect x="${x - 10}" y="${y - 7}" width="20" height="14" class="f-rock2"/><rect x="${x - 3}" y="${y - 2}" width="6" height="4" class="f-colony"/>`;
    return bg("f-rock") +
      `<path d="${wall}" class="s-dust nofill draw" stroke-width="8" stroke-linejoin="round" pathLength="1" style="--du:1.6s"/>
       <path d="M${gx} ${V[7][1]} L${gx} 232 M${gx} 268 L${gx} ${V[0][1]}" class="s-dust" stroke-width="8"/>
       <rect x="${gx - 4}" y="232" width="8" height="36" class="f-ochre" opacity=".7"/>
       <rect x="355" y="225" width="50" height="50" class="f-dust"/><rect x="366" y="236" width="28" height="28" class="f-rock2"/>
       ${homes}
       <g class="fade" style="--t:1.4s">
         ${line(G, N1)}${line(N1, V[5])}${line(N1, V[6])}${line(N1, V[7])}${line(G, V[4])}${line(G, V[3])}${line(N1, gateT[0])}
         <g class="darken" style="--t:6.2s">${line(G, N2)}${line(N2, V[0])}${line(N2, V[1])}${line(N2, V[2])}${line(N2, gateT[1])}</g>
       </g>
       <circle cx="${G[0]}" cy="${G[1]}" r="16" class="f-rock2 s-core" stroke-width="2"/><circle cx="${G[0]}" cy="${G[1]}" r="7" class="f-core pulse" filter="url(#glow)"/>
       <rect x="${N1[0] - 6}" y="${N1[1] - 6}" width="12" height="12" class="f-core"/>
       <rect x="${N2[0] - 6}" y="${N2[1] - 6}" width="12" height="12" class="f-core"/>
       ${up.map(p => turret(p)).join("")}${turret(gateT[0])}
       <g>${down.map(p => turret(p)).join("")}${turret(gateT[1])}</g>
       <g class="darken" style="--t:6.2s">${down.map(p => `<circle cx="${p[0]}" cy="${p[1]}" r="3" class="f-core"/>`).join("")}</g>
       <g class="fade" style="--t:6s;--du:.3s"><path d="M${N2[0] - 11} ${N2[1] - 11} l22 22 M${N2[0] + 11} ${N2[1] - 11} l-22 22" class="s-rust" stroke-width="4" stroke-linecap="round"/>
         <path d="M${N2[0]} ${N2[1] + 14} V${N2[1] + 100}" class="s-rust" stroke-width="1.2" stroke-dasharray="3 4"/>
         ${lbl(N2[0], N2[1] + 124, "ONE NODE CUT: DARK", "", "middle", "fill:var(--rust)")}</g>
       <g><path d="M640 92 l16 9 v18 l-16 9 l-16 -9 v-18z" class="f-rock2 s-core" stroke-width="1.6"/><polygon points="640,100 645,111 640,120 635,111" class="f-core pulse" filter="url(#glow)"/>
          <path d="M668 392 l16 9 v18 l-16 9 l-16 -9 v-18z" class="f-rock2 s-core" stroke-width="1.6"/><polygon points="668,400 673,411 668,420 663,411" class="f-core pulse" filter="url(#glow)"/>
          ${lbl(668, 62, "THE RICH GROUND", "", "middle", "fill:var(--core)")}${lbl(668, 466, "IS OUTSIDE", "", "middle", "fill:var(--core)")}</g>
       ${tr}${swarm}`;
  },
  planet() {
    const cx = 290, cy = 250, R = 185, s = 20, w = Math.sqrt(3) * s, r = rng(41);
    const home = [cx - 40, cy + 30]; let hex = "";
    for (let row = -8; row <= 8; row++) for (let col = -7; col <= 7; col++) {
      const x = cx + (col + (row & 1 ? .5 : 0)) * w, y = cy + row * 1.5 * s;
      if (Math.hypot(x - cx, y - cy) > R + 14) continue;
      const d = Math.hypot(x - home[0], y - home[1]) / w;
      let cls = "f-rock2", op = .55, extra = "";

// ---------- the stepper ----------
const $ = id => document.getElementById(id);
const stage = $("stage"), copy = $("copy"), progress = $("progress"), count = $("count"), prev = $("prev"), next = $("next");
let reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
try { const m = localStorage.getItem("orbis.journey.motion"); if (m) reduced = m === "off"; } catch { /* blocked */ }
let cur = -1, mediaOff = false;
const motionBtn = $("motion");
const applyMotion = () => {
  document.documentElement.classList.toggle("still", reduced);
  motionBtn.textContent = reduced ? "Motion off" : "Motion on";
  motionBtn.setAttribute("aria-pressed", String(!reduced));
};
motionBtn.addEventListener("click", () => {
  reduced = !reduced;
  try { localStorage.setItem("orbis.journey.motion", reduced ? "off" : "on"); } catch { /* blocked */ }
  applyMotion();
  const i = cur; cur = -1; go(i);
});
applyMotion();

ACTS.forEach((name, a) => {
  const steps = STEPS.map((s, i) => [s, i]).filter(([s]) => s.act === a);
  const el = document.createElement("div");
  el.className = "act"; el.style.flex = String(steps.length); el.dataset.act = a;
  el.innerHTML = `<span class="act-name">${name}</span><div class="segs">${steps.map(([s, i]) => `<button type="button" class="seg" data-i="${i}" aria-label="Step ${i + 1}: ${s.title}"></button>`).join("")}</div>`;
  progress.appendChild(el);
});
progress.addEventListener("click", e => { const b = e.target.closest(".seg"); if (b) go(+b.dataset.i); });

// optional art (Midjourney stills or clips): list a file here, by step id, and it replaces the drawing
// with a toggle back to it. Files live in media/ next to this page. Example: hook: "media/hook.mp4"
const MEDIA = {
};
async function findMedia(id) { return MEDIA[id] || null; }

function drawScene(s) {
  stage.innerHTML = `<svg class="scene" viewBox="0 0 800 500" role="img" aria-label="${s.alt}">${SCENES[s.id]()}</svg>`;
  const svg = stage.querySelector("svg");
  try { svg.setCurrentTime(0); if (reduced) { svg.setCurrentTime(7); svg.pauseAnimations(); } } catch { /* no SMIL */ }
  return svg;
}

async function showMedia(s) {
  const src = await findMedia(s.id);
  if (!src || STEPS[cur] !== s) return;
  const btn = document.createElement("button");
  btn.type = "button"; btn.className = "media-toggle";
  const paint = () => {
    stage.querySelectorAll("video,img").forEach(n => n.remove());
    stage.querySelector("svg").style.visibility = mediaOff ? "visible" : "hidden";
    btn.textContent = mediaOff ? "Show art" : "Show diagram";
    if (mediaOff) return;
    const isVid = /\.(mp4|webm)$/.test(src);
    const m = document.createElement(isVid ? "video" : "img");
    m.src = src; m.alt = s.alt;
    if (isVid) { m.muted = true; m.loop = true; m.playsInline = true; m.autoplay = !reduced; m.setAttribute("aria-label", s.alt); }
    stage.prepend(m);
  };
  btn.addEventListener("click", () => { mediaOff = !mediaOff; paint(); });
  stage.appendChild(btn); paint();
}

function go(i) {
  i = Math.max(0, Math.min(STEPS.length - 1, i));
  if (i === cur) return;
  cur = i;
  const s = STEPS[i];
  drawScene(s);
  copy.innerHTML = `<p class="kicker">${ACTS[s.act]} · ${s.kicker}</p><h2>${s.title}</h2>${s.body}`;
  [...copy.children].forEach((el, k) => el.style.setProperty("--i", k));
  copy.scrollTop = 0;
  progress.querySelectorAll(".seg").forEach(b => { const j = +b.dataset.i; b.classList.toggle("done", j < i); b.classList.toggle("cur", j === i); b.toggleAttribute("aria-current", j === i); });
  progress.querySelectorAll(".act").forEach(a => a.classList.toggle("on", +a.dataset.act === s.act));
  count.innerHTML = `<b>${String(i + 1).padStart(2, "0")}</b> / ${STEPS.length}`;
  prev.disabled = i === 0;
  next.textContent = i === STEPS.length - 1 ? "Start again" : "Next";
  try { history.replaceState(null, "", `#${s.id}`); } catch { /* sandboxed */ }
  if (s.id === "offer") wireOffer();
  if (s.id === "next") wireEnd();
  showMedia(s);
}

function wireOffer() {
  const acc = $("offer-accept"), ref = $("offer-refuse"), res = $("offer-result");
  const pick = yes => {
    const svg = stage.querySelector("svg");
    svg.classList.remove("accepted", "refused"); void svg.getBoundingClientRect();
    svg.classList.add(yes ? "accepted" : "refused");
    acc.setAttribute("aria-pressed", String(yes)); ref.setAttribute("aria-pressed", String(!yes));
    res.hidden = false;
    res.className = yes ? "hit dark" : "hit";
    res.textContent = yes
      ? "It works. They walk down singing, the waves stop, and the region goes quiet for a long time. Then the planet asks for more. And one night a wave comes over your wall, and some of them are wearing your colony's suits."
      : "The waves keep coming. You hold the line the hard way, and people die on the wall instead. Later you find out what you spared them.";
  };
  acc.addEventListener("click", () => pick(true));
  ref.addEventListener("click", () => pick(false));
}

function wireEnd() {
  $("reads").innerHTML = READS.map(([href, t, d]) => LOCAL
    ? `<a href="${href}"><b>${t}</b><span>${d}</span></a>`
    : `<div><b>${t}</b><span>${d}</span></div>`).join("") +
    (LOCAL ? "" : `<p class="hint">These pages live on Ed's Orbis concept site. Ask him for the tour.</p>`);
  $("again").addEventListener("click", () => go(0));
}

prev.addEventListener("click", () => go(cur - 1));
next.addEventListener("click", () => go(cur === STEPS.length - 1 ? 0 : cur + 1));
addEventListener("keydown", e => {
  if (e.altKey || e.ctrlKey || e.metaKey) return;
  if (e.key === "ArrowRight" || e.key === "PageDown") { e.preventDefault(); go(cur + 1); }
  else if (e.key === "ArrowLeft" || e.key === "PageUp") { e.preventDefault(); go(cur - 1); }
  else if (e.key === "Home") go(0);
  else if (e.key === "End") go(STEPS.length - 1);
});
let tx = 0, ty = 0;
$("main").addEventListener("touchstart", e => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, { passive: true });
$("main").addEventListener("touchend", e => {
  const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
  if (Math.abs(dx) > 50 && Math.abs(dx) > 1.5 * Math.abs(dy)) go(cur + (dx < 0 ? 1 : -1));
}, { passive: true });
const fromHash = () => { const k = STEPS.findIndex(s => s.id === location.hash.slice(1)); return k < 0 ? 0 : k; };
addEventListener("hashchange", () => go(fromHash()));
go(fromHash());
})();
</script>
</body>
</html>
